spring.application.name=API-GATEWAY

server.port=9000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Disable automatic discovery locator
# We are configuring explicit routes
spring.cloud.gateway.server.webmvc.routes[0].id=quiz-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://QUIZ-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/quiz-service/**

# Remove /quiz-service from incoming URL
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Question Service
spring.cloud.gateway.server.webmvc.routes[1].id=question-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://QUESTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/question-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Authentication Service
spring.cloud.gateway.server.webmvc.routes[2].id=Authentication-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://AUTHENTICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/authentication-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1