spring.application.name=Quiz-Service

# DB Config
spring.datasource.username = root
spring.datasource.password = KavinDharani@3
spring.datasource.url = jdbc:mysql://localhost:3306/quiz

#JPA Config
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

server.port=8090

#Register with Server Registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

#JWT config
jwt.secret=DBL0hnWandbbC5h1WbdHyFcq8Q+JuWZF8PD30SMTU8E=



# Question Service Feign timeout configuration

spring.cloud.openfeign.client.config.Question-Service.connectTimeout=2000
spring.cloud.openfeign.client.config.Question-Service.readTimeout=20000


# Retry configuration
resilience4j.retry.instances.questionService.maxAttempts=3
resilience4j.retry.instances.questionService.waitDuration=1s

# Exponential backoff
resilience4j.retry.instances.questionService.enableExponentialBackoff=true
resilience4j.retry.instances.questionService.exponentialBackoffMultiplier=2

# Circuit Breaker Configuration

resilience4j.circuitbreaker.instances.questionService.registerHealthIndicator=true

# Number of calls to remember
resilience4j.circuitbreaker.instances.questionService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.questionService.slidingWindowSize=10

# Minimum calls required before calculating failure rate
resilience4j.circuitbreaker.instances.questionService.minimumNumberOfCalls=5

# Open circuit if failure rate reaches 50%
resilience4j.circuitbreaker.instances.questionService.failureRateThreshold=50

# Stay OPEN for 10 seconds
resilience4j.circuitbreaker.instances.questionService.waitDurationInOpenState=10s

# Allow 3 test calls in HALF_OPEN
resilience4j.circuitbreaker.instances.questionService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.questionService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Not considering unauthorized issue
resilience4j.circuitbreaker.instances.questionService.ignoreExceptions=io.github.resilience4j.ratelimiter.RequestNotPermitted

# Actuator
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents

management.endpoint.health.show-details=always


# Rate Limiter
resilience4j.ratelimiter.instances.questionService.limitForPeriod=4
resilience4j.ratelimiter.instances.questionService.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.questionService.timeoutDuration=0

# Bulkhead configuration
resilience4j.bulkhead.instances.questionService.maxConcurrentCalls=3
resilience4j.bulkhead.instances.questionService.maxWaitDuration=0

